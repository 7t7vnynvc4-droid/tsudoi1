<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="お金カウンター">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e"  media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>お金カウンター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ▼ ヘッダー -->
<header class="header">
  <h1>💴 お金カウンター</h1>
</header>

<!-- ▼ メイン -->
<div class="main">

  <!-- 帳簿残高（直接入力） -->
  <div class="ledger-area">
    <div class="ledger-label">帳簿上の残額</div>
    <div class="ledger-input-wrap">
      <span class="ledger-yen">¥</span>
      <input
        id="ledgerInput"
        class="ledger-input"
        type="number"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="0"
        min="0"
        autocomplete="off"
      >
    </div>
  </div>

  <!-- 2列：紙幣 ／ 硬貨 -->
  <div class="columns">
    <div class="column-card">
      <div class="column-header">紙 幣</div>
      <div id="billRows"></div>
    </div>
    <div class="column-card">
      <div class="column-header">硬 貨</div>
      <div id="coinRows"></div>
    </div>
  </div>

  <!-- サマリー -->
  <div class="summary">
    <div class="summary-row">
      <span class="summary-label">カウント合計</span>
      <span class="summary-value" id="totalDisplay">¥0</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">帳簿上の残額</span>
      <span class="summary-value" id="ledgerDisplay">¥0</span>
    </div>
    <div class="summary-row diff-row">
      <div>
        <div class="diff-label">差 異</div>
        <div class="diff-value zero" id="diffDisplay">±0円</div>
      </div>
    </div>
  </div>

</div><!-- /.main -->

<!-- ▼ リセット -->
<div class="reset-area">
  <button class="reset-btn" id="resetBtn">すべてリセット</button>
</div>


<!-- ============================================================
     枚数ドラムロールピッカー（各金種共用）
     ============================================================ -->
<div class="picker-overlay" id="countOverlay"></div>
<div class="picker-sheet"   id="countSheet" role="dialog">

  <div class="pk-handle" id="countHandle"></div>

  <div class="pk-toolbar">
    <button class="pk-cancel" id="countCancel">キャンセル</button>
    <span   class="pk-title"  id="countTitle">枚数を選択</span>
    <button class="pk-done"   id="countDone">決 定</button>
  </div>

  <!-- ラベル行：.pk-drum-wrap の外に置くことで
       .pk-col の高さ = DRUM_H に正確に一致させる -->
  <div class="pk-label-row">
    <div class="pk-col-label">枚</div>
  </div>

  <!-- ドラムロール本体（高さ = DRUM_H = 200px） -->
  <div class="pk-drum-wrap" id="countDrumWrap">
    <div class="pk-selection"></div>
    <div class="pk-col" id="countCol">
      <div class="pk-col-inner" id="countInner"></div>
    </div>
  </div>

  <div class="pk-preview" id="countPreview">0枚</div>

</div>


<!-- ============================================================
     iOS風確認モーダル
     ============================================================ -->
<div class="modal-overlay" id="confirmOverlay" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-body">
      <div class="modal-title" id="modalTitle">リセットの確認</div>
      <div class="modal-msg"   id="modalMsg">すべての枚数と帳簿残額をリセットします。</div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" id="modalCancel">キャンセル</button>
      <button class="modal-btn-ok"     id="modalOk">リセット</button>
    </div>
  </div>
</div>


<!-- ▼ スクリプト -->
<script src="app.js"></script>

<!-- ▼ PWA Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
