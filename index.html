<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="お金カウンター">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>お金カウンター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ▼ ヘッダー -->
<header class="header">
  <h1>💴 お金カウンター</h1>
</header>

<!-- ▼ メインコンテンツ -->
<div class="main">

  <!-- 帳簿残額（ピッカートリガー） -->
  <div class="ledger-area">
    <div class="ledger-label">帳簿上の残額（タップして入力）</div>
    <div class="ledger-trigger" id="ledgerTrigger" role="button" aria-label="帳簿残額を入力">
      <span class="ledger-yen">¥</span>
      <span class="ledger-value" id="ledgerValueDisplay">0</span>
      <span class="ledger-chevron">›</span>
    </div>
  </div>

  <!-- 2列グリッド：紙幣 ／ 硬貨 -->
  <div class="columns">
    <div class="column-card">
      <div class="column-header">紙 幣</div>
      <div id="billRows"></div>
    </div>
    <div class="column-card">
      <div class="column-header">硬 貨</div>
      <div id="coinRows"></div>
    </div>
  </div>

  <!-- サマリー -->
  <div class="summary">
    <div class="summary-row">
      <span class="summary-label">カウント合計</span>
      <span class="summary-value" id="totalDisplay">¥0</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">帳簿上の残額</span>
      <span class="summary-value" id="ledgerDisplay">¥0</span>
    </div>
    <div class="summary-row diff-row">
      <div>
        <div class="diff-label">差 異</div>
        <div class="diff-value zero" id="diffDisplay">±0円</div>
      </div>
    </div>
  </div>

</div><!-- /.main -->

<!-- ▼ リセットボタン -->
<div class="reset-area">
  <button class="reset-btn" id="resetBtn">すべてリセット</button>
</div>


<!-- ============================================================
     ドラムロールピッカー
     ============================================================ -->
<div class="picker-overlay" id="pickerOverlay"></div>

<div class="picker-sheet" id="pickerSheet" role="dialog" aria-label="帳簿残額を入力">

  <!-- ドラッグハンドル -->
  <div class="picker-handle" id="pickerHandle"></div>

  <!-- ツールバー -->
  <div class="picker-toolbar">
    <button class="picker-btn-cancel" id="pickerCancel">キャンセル</button>
    <span class="picker-toolbar-title">帳簿残額</span>
    <button class="picker-btn-done"   id="pickerDone">決 定</button>
  </div>

  <!-- ピッカー本体（JS で生成） -->
  <div class="picker-body" id="pickerBody">
    <!-- picker-highlight は buildPicker() で挿入 -->
  </div>

  <!-- プレビュー -->
  <div class="picker-preview" id="pickerPreview">¥ 0</div>

</div>


<!-- ============================================================
     確認モーダル（iOS風）
     ============================================================ -->
<div class="confirm-overlay" id="confirmOverlay" role="dialog" aria-modal="true">
  <div class="confirm-dialog">
    <div class="confirm-body">
      <div class="confirm-title"   id="confirmTitle">リセットの確認</div>
      <div class="confirm-message" id="confirmMessage">すべての枚数と帳簿残額をリセットします。</div>
    </div>
    <div class="confirm-actions">
      <button class="btn-cancel-modal" id="confirmCancel">キャンセル</button>
      <button class="btn-reset-modal"  id="confirmDoReset">リセット</button>
    </div>
  </div>
</div>


<!-- ▼ JS -->
<script src="app.js"></script>

<!-- ▼ PWA Service Worker 登録 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
